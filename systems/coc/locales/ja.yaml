    大學教授: {label: 大学教授, desc: "授業・研究・指導・学術発表が主な仕事"}
    作家: {label: 作家, desc: "長編の執筆・出版・文章の創作が主な仕事"}
    私家偵探: {label: 私立探偵, desc: "事実確認・手がかりの追跡・断片的な情報をつなげて結論を出すことが主な仕事"}
    醫師: {label: 医師, desc: "患者の診断・治療・看護が主な仕事"}
