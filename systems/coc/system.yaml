# 系統包：1920s／現代調查員（d100 系統）
#
# 這是一個「系統包」，引擎不認識任何規則，規則全在這裡。要換成別的 TRPG，
# 複製一份改掉這個檔就好，engine/ 一行都不用動。
#
# 授權註記：技能名稱是 d100 系這類遊戲的通用術語；**本檔所有描述文字皆為原創**，
# 沒有轉載任何出版品的條目內容。本專案與 Chaosium 無關，亦非任何遊戲的官方或
# 相容產品。詳見 systems/coc/README.md。

name: coc
title: 1920s／現代調查員（d100）

# ── 特性值：履歷或背景故事裡讀不出來的東西，一律擲骰，不問模型 ──────────────
# aliases：玩家在角色卡【特性值】裡可能寫的名字（三語）。解析時一律換回左邊的代碼，
# 不然「幸運 50」會變成跟擲骰的 LUCK 並存的另一格。
characteristics:
  STR: {dice: "3d6", mul: 5, label: 力量, aliases: [力量, 筋力, Strength]}
  CON: {dice: "3d6", mul: 5, label: 體質, aliases: [體質, 体質, 体力, Constitution]}
  SIZ: {dice: "2d6+6", mul: 5, label: 體型, aliases: [體型, 体型, 体格, Size]}
  DEX: {dice: "3d6", mul: 5, label: 敏捷, aliases: [敏捷, 敏捷性, Dexterity]}
  APP: {dice: "3d6", mul: 5, label: 外貌, aliases: [外貌, 外見, 容貌, Appearance]}
  POW: {dice: "3d6", mul: 5, label: 意志, aliases: [意志, 精神力, Power]}
  LUCK: {dice: "3d6", mul: 5, label: 幸運, aliases: [幸運, 運, Luck]}
  INT: {dice: "2d6+6", mul: 5, label: 智力, aliases: [智力, 知性, Intelligence]}
  # EDU 由文件判讀，不擲骰——學歷是履歷上少數真的寫得出來的東西
  EDU: {derived: education, aliases: [教育, Education]}

education_levels:
  - {level: 沒有任何學歷或進修紀錄, value: 30}
  - {level: 高中或同等, value: 45}
  - {level: 專科或學士, value: 60}
  - {level: 碩士, value: 75}
  - {level: 博士或同等的長期研究訓練, value: 85}

# ── 點數預算 ────────────────────────────────────────────────────────────
# 履歷模式不套（see modes），檢查模式套。formula 只准用特性值名稱與四則運算。
budget:
  occupation: "EDU * 4"
  interest: "INT * 2"

# ── 衍生值 ─────────────────────────────────────────────────────────────
# 卡面上的 HP／MP／SAN。全部是程式照特性值算，模型不碰。
# 算式跟 budget 同一套語法（特性值名稱、數字、+ - * /、括號），結果無條件捨去。
# 角色版玩家沒填齊需要的特性值時，那一格留空，不擲骰補。
derived:
  HP: "(CON + SIZ) / 10"
  MP: "POW / 5"
  SAN: "POW"

# ── 證據量表 ───────────────────────────────────────────────────────────
# 五級通用量表，兩個模式共用。{meaning} 由各技能的 meaning 填入——
# 技能名稱是行話（「圖書館使用」不是「去圖書館」），不附定義模型會照字面讀。
evidence_levels:
  - 文件裡完全沒有任何跟這項能力有關的東西
  - 提到相關的環境或接觸，但沒有說這個人會用
  - 交代了學習或接觸這項能力的管道
  - 交代了實際運用這項能力的經歷
  - 交代了長期、專業程度的訓練或經歷
# 各級的背景最多撐得起多少技能值（檢查模式用）
evidence_ceiling: [20, 30, 50, 70, 90]
# 各級對應的技能值（建卡模式用；索引 0 一律用該技能的 base）
evidence_value: [null, 20, 40, 60, 80]

# ── 技能表 ─────────────────────────────────────────────────────────────
# base = 未受訓練的基礎值；meaning = 這項技能實際上在測什麼（給模型看的定義）。
# reachable: false = 文件通常讀不出來（體能、戰鬥類），預設不問，用 --all 才問。
skills:
  會計: {base: 5, meaning: 看懂帳目與財報、從帳務裡發現異常, evidence: 預算、報價、成本控管、營收或效益的數字、財報、查帳}
  人類學: {base: 1, meaning: 透過長期觀察理解一個族群的文化與行為模式, evidence: 田野調查、使用者研究、跨文化或社群觀察的研究產出}
  估價: {base: 5, meaning: 判斷物件的價值、真偽與市場行情, evidence: 評估、選型、鑑價、比較方案優劣並下結論的職責或報告}
  考古學: {base: 1, meaning: 鑑定遺址與古物、判斷年代與來歷, evidence: 考古、古物鑑定、遺址或文物研究}
  魅惑: {base: 15, meaning: 靠個人魅力、外表或討喜的態度讓對方願意配合, evidence: 公開演講、主持、媒體露出、社群經營、代表組織對外發言}
  攀爬: {base: 20, meaning: 徒手或用簡單裝備爬上陡坡、牆面或岩壁, evidence: 攀岩、登山、高處作業, reachable: false}
  電腦使用: {base: 5, meaning: 操作電腦、寫程式、處理資料、在系統裡找出東西——一般上網打字不算, evidence: 具名的程式語言或框架、做出來並在運作的系統、架構設計、資料處理}
  信用評級: {base: 0, meaning: 這個人的經濟地位與外界對其財力的評價, evidence: 職級、年資、穩定的受僱紀錄、自行執業且有客戶、薪資級距}
  喬裝: {base: 5, meaning: 改變外表與舉止讓人認不出來或誤認, evidence: 改扮、臥底、易容, reachable: false}
  閃避: {base: 0, meaning: 躲開衝著自己來的攻擊或危險, evidence: 格鬥、競技、需要閃避危險的體能活動, reachable: false}
  駕駛汽車: {base: 20, meaning: 在一般與緊急狀況下操控汽車, evidence: 開車通勤或跑外務、長途駕駛、需要用車的工作}
  電氣維修: {base: 10, meaning: 處理電線、配電與一般電器的安裝維修, evidence: 配電、電器安裝維修、水電相關工作}
  電子學: {base: 1, meaning: 處理電子電路、通訊設備與精密電子裝置, evidence: 電路、韌體、感測器、通訊或硬體裝置的實作}
  話術: {base: 5, meaning: 用花言巧語、繞過對方戒心的方式取得想要的東西——一般的溝通不算, evidence: 談判、業務、公關、套話、讓對方講出本來不想講的東西}
  鬥毆: {base: 25, meaning: 徒手或用手邊物品進行近身打鬥, evidence: 格鬥訓練、武術、需要動手的衝突處理, reachable: false}
  射擊: {base: 20, meaning: 使用槍械命中目標, evidence: 軍警經歷、射擊訓練、槍械使用, reachable: false}
  急救: {base: 30, meaning: 對傷者做立即處置、止血、穩定狀況——不是治療疾病, evidence: 急救證照、救護、現場傷患處置}
  歷史: {base: 5, meaning: 對歷史事件、時代背景與史料的知識, evidence: 人文社會學科的學歷或訓練、史料研究、歷史相關的寫作或教學}
  恐嚇: {base: 15, meaning: 用威脅、施壓或氣勢逼對方就範, evidence: 催收、稽查、執法、需要施壓對方的職責}
  跳躍: {base: 20, meaning: 跳過距離或高度、控制落地, evidence: 體操、田徑、需要跳躍的體能活動, reachable: false}
  母語: {base: 0, meaning: 用自己的母語讀寫與表達的水準；基準值等於 EDU，受過高等教育就該接近 EDU, evidence: 學歷程度、以母語寫作或授課、需要大量讀寫的工作}
  外語: {base: 1, meaning: 讀寫聽說一種非母語語言的水準, evidence: 外語檢定、外語授課或發表、海外客戶、以外語工作}
  法律: {base: 5, meaning: 熟悉法律條文、訴訟程序與權利義務, evidence: 契約、法遵、專利、訴訟、智慧財產相關的職責或產出}
  圖書館使用: {base: 20, meaning: 在書籍、檔案、報紙、資料庫裡找出需要的資訊——不限於去圖書館, evidence: 研究、文獻回顧、調查採訪、查證、資料蒐集的職責或產出}
  聆聽: {base: 20, meaning: 聽出聲音裡的細節、聽懂對方沒明說的意思, evidence: 訪談、需求訪查、客服、擔任不同專業之間的溝通窗口}
  鎖匠: {base: 1, meaning: 開鎖、撬鎖、處理門鎖與保險櫃, evidence: 鎖具、保全、開鎖相關的訓練或工作}
  機械維修: {base: 10, meaning: 修理與組裝實體機具、引擎、工具, evidence: 修理或組裝實體機具、引擎、工具、自己動手弄車或設備}
  醫學: {base: 1, meaning: 診斷疾病與傷勢、給予醫療處置的專業能力——急救是另一項, evidence: 醫療專業訓練、臨床工作、診療職責}
  博物學: {base: 10, meaning: 對動植物、地貌與自然環境的辨識與知識, evidence: 生態、動植物、環境、農林漁牧相關的知識或工作}
  導航: {base: 10, meaning: 判斷方位、看懂地圖海圖、在陌生地形中定位, evidence: 航海、飛行、野外定位、地圖判讀、長途路線規劃}
  神秘學: {base: 5, meaning: 對民間信仰、儀式、超自然傳說的知識, evidence: 民俗、宗教、儀式、超自然題材的研究或寫作}
  操作重型機械: {base: 1, meaning: 操作工程車、吊車與大型機具, evidence: 工地、吊車、工程車、大型設備操作, reachable: false}
  說服: {base: 10, meaning: 用講道理、擺事實的方式讓對方改變想法或同意配合, evidence: 提案、顧問、內部推動、讓決策者採納某個方案並有結果}
  精神分析: {base: 1, meaning: 長期的心理治療與心理創傷處置, evidence: 心理諮商、心理治療、長期輔導的專業訓練或工作}
  心理學: {base: 10, meaning: 從言行舉止讀出對方真正的動機或情緒, evidence: 訪談、使用者研究、判讀對方動機、在不同立場之間翻譯意圖}
  騎術: {base: 5, meaning: 騎乘與控制馬匹等坐騎, evidence: 騎馬、馬術, reachable: false}
  科學: {base: 1, meaning: 某個自然科學領域的專業訓練與研究方法, evidence: 理工學歷、實驗、量測、技術產出、經外部檢驗的研究成果}
  妙手: {base: 10, meaning: 手法俐落地拿取、藏匿或調包東西而不被發現, evidence: 魔術、扒竊、需要手法的技藝, reachable: false}
  偵查: {base: 25, meaning: 注意到別人忽略的線索、看出現場不對勁的地方, evidence: 稽核、查核、品質檢驗、找出別人沒看到的問題}
  潛行: {base: 20, meaning: 不被發現地移動或隱蔽, evidence: 跟監、潛入、需要不被發現的工作, reachable: false}
  生存: {base: 10, meaning: 在野外取得食水、避難、活下來, evidence: 野外活動、露營、長期戶外工作}
  游泳: {base: 20, meaning: 在水中移動與自救, evidence: 游泳、水上活動、救生, reachable: false}
  投擲: {base: 20, meaning: 準確地把東西丟向目標, evidence: 球類、投擲類運動, reachable: false}
  追蹤: {base: 10, meaning: 循著痕跡找出人或動物的去向, evidence: 搜救、野外追蹤、循線找人找物}
  動物馴養: {base: 5, meaning: 安撫、訓練與駕馭動物, evidence: 養殖、獸醫、動物訓練或照護}
  潛水: {base: 1, meaning: 使用裝備在水下作業, evidence: 潛水證照、水下作業, reachable: false}
  爆破: {base: 1, meaning: 安全地設置與引爆炸藥、或拆除爆裂物, evidence: 爆破、拆彈、礦業或工程爆破, reachable: false}
  讀唇: {base: 1, meaning: 只看嘴型讀出對方說了什麼, evidence: 聽障相關訓練、讀唇語, reachable: false}
  催眠: {base: 1, meaning: 對他人施行催眠並加以引導, evidence: 催眠訓練或執業, reachable: false}
  藝術與手藝: {base: 5, meaning: 某項創作或工藝的實作能力（寫作、攝影、繪畫、設計、木工等）, evidence: 創作、設計、影像產製的職責或作品，尤其是有對外發表、獲獎或商用的}
  攝影: {base: 5, meaning: 拍攝、沖洗與判讀照片, evidence: 攝影作品、影像產製、拍攝相關的工作}
  駕駛: {base: 1, meaning: 操控飛機、船舶等汽車以外的載具, evidence: 飛行執照、船舶操作、汽車以外的載具, reachable: false}
  領導: {base: 5, meaning: 帶領一群人、分配工作、讓團隊往同一個方向走, evidence: 帶團隊、分配工作、擔任主管或共同創辦人}
  教學: {base: 5, meaning: 把知識與技能有效地傳授給別人, evidence: 授課、內訓、講師資格、課程設計、帶學生或後輩}
  談判: {base: 5, meaning: 在有衝突的利益之間談出雙方都能接受的條件, evidence: 合約談判、採購議價、在有衝突的利益之間談出條件}

